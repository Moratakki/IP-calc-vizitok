<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор визиток</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1 class="display-3 text-center">Калькулятор визиток</h1>

        <div class="row">
            <div class="col-12 col-md-4">
                <div class="calc shadow-lg p-4">
                    <h3>Расчёт стоимости</h3>

                    <label for="card-quantity" class="form-label">Количество</label>
                    <input type="number" min="30" value="90" step="30" class="form-control" id="card-quantity">

                    <label for="card-paper" class="form-label mt-3">Тип бумаги</label>
                    <select class="form-control" id="card-paper"></select>

                    <label for="card-color" class="form-label mt-3">Цветность</label>
                    <select class="form-control" id="card-color"></select>

                    <h4 class="mt-4">Стоимость тиража</h4>
                    <p class="display-4"><span id="final-price">0</span> ₽</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
